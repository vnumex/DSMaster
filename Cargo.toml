[package]
name = "dsmaster"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Low-latency DualSense controller manager and virtual gamepad emulator for Windows"
readme = "README.md"
keywords = ["dualsense", "controller", "gamepad", "vigem", "windows"]
categories = ["hardware-support", "gui"]

[dependencies]
arc-swap = "1.9"
bitflags = "2"
crc32fast = "1.5"
crossbeam-channel = "0.5"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.gui]
inherits = "dev"
opt-level = 2
debug = false
debug-assertions = true
