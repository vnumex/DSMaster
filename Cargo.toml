[package]
name = "dsmaster"
version = "0.3.2"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Low-latency DualSense controller manager and virtual gamepad emulator for Windows"
readme = "README.md"
keywords = ["dualsense", "controller", "gamepad", "vigem", "windows"]
categories = ["hardware-support", "gui"]

[dependencies]
arc-swap = "1.9"
bitflags = "2"
crc32fast = "1.5"
crossbeam-channel = "0.5"
gpui = { version = "0.2.2", default-features = false }
parking_lot = "0.12"
raw-window-handle = "0.6"
rusty-opus = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.gui]
inherits = "dev"
opt-level = 2
debug = false
debug-assertions = true
